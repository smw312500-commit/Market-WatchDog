<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ project_name }} - Decoy 데모</title>
<style>
:root{--bg:#0f1117;--panel:#1a1d27;--border:#2d3148;--text:#e2e8f0;--muted:#64748b;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--mono:'Courier New',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;min-height:100vh;}
nav{background:#111;padding:14px 20px;display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--border);}
nav .logo{color:var(--green);font-weight:700;font-size:14px;font-family:var(--mono);}
nav a{color:#888;text-decoration:none;font-size:13px;}
nav a:hover{color:#fff;}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px;}
.page-header{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:24px;}
.page-header h2{font-size:18px;color:#fff;font-family:var(--mono);}
.page-header p{color:var(--muted);font-size:11px;margin-top:4px;}

/* 컨트롤 바 */
.control-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:6px;flex-wrap:wrap;}
.control-bar label{font-size:11px;color:var(--muted);}
.control-bar input{padding:6px 10px;background:#0f1117;border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;width:160px;}
.btn{padding:7px 16px;border-radius:4px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn-green{background:var(--green);color:#000;}
.btn-red{background:var(--red);color:#fff;}
.btn-blue{background:var(--blue);color:#fff;}
.divider{width:1px;height:20px;background:var(--border);}
.mode-badge{padding:4px 10px;border-radius:3px;font-size:11px;font-weight:700;font-family:var(--mono);}
.mode-original{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.mode-decoy{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}

/* 비교 그리드 */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.pane{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.pane-header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.pane-header span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;}
.pane-body{padding:14px 16px;font-family:var(--mono);font-size:11px;line-height:1.8;min-height:320px;overflow-y:auto;max-height:480px;white-space:pre-wrap;word-break:break-all;}
.left .pane-header{background:rgba(34,197,94,.07);}
.left .pane-header span{color:var(--green);}
.right .pane-header{background:rgba(239,68,68,.07);}
.right .pane-header span{color:var(--red);}
.key{color:#7dd3fc;}
.val-num{color:#fbbf24;}
.val-str{color:#a3e635;}
.val-decoy{color:#f87171;}

/* 날짜 규칙 표시 */
.rule-box{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:20px;font-family:var(--mono);font-size:11px;line-height:1.9;color:#94a3b8;}
.rule-box .hl{color:var(--amber);}
.rule-box .title{color:#fff;font-size:12px;font-weight:700;margin-bottom:8px;}

/* 로그 스트림 */
.log-stream{background:#0a0c10;border:1px solid var(--border);border-radius:6px;padding:14px;font-family:var(--mono);font-size:11px;line-height:1.7;max-height:160px;overflow-y:auto;}
.log-ok{color:var(--green);}
.log-warn{color:var(--red);}
.log-info{color:var(--muted);}
</style>
</head>
<body>
<nav>
  <span class="logo">&gt; MWD_SECURITY</span>
  <a href="/">홈</a>
  <a href="/analysis">시장감시</a>
  <a href="/demo" style="color:#fff;">Decoy 데모</a>
  <a href="/admin">관리자</a>
</nav>

<div class="wrap">
  <div class="page-header">
    <h2>Date-Based Dynamic Decoy Security Layer — 시연</h2>
    <p>같은 API 엔드포인트, 같은 데이터 — 인증 여부에 따라 완전히 다른 응답</p>
  </div>

  <!-- 날짜 규칙 -->
  <div class="rule-box">
    <div class="title">오늘의 치환 규칙</div>
    <div id="ruleText">계산 중...</div>
  </div>

  <!-- 컨트롤 -->
  <div class="control-bar">
    <button class="btn btn-green" onclick="fetchOriginal()">정상 접근 (로그인)</button>
    <div class="divider"></div>
    <button class="btn btn-red" onclick="fetchDecoy()">비정상 접근 (토큰 없음)</button>
    <div class="divider"></div>
    <button class="btn btn-blue" onclick="resetAll()">초기화</button>
  </div>

  <!-- 비교 -->
  <div class="compare">
    <div class="pane left">
      <div class="pane-header">
        <span>ORIGINAL</span>
        <span id="badgeLeft" class="mode-badge mode-original" style="display:none;">ORIGINAL MODE</span>
      </div>
      <div class="pane-body" id="leftPane"><span style="color:var(--muted);">정상 접근 버튼을 눌러주세요.</span></div>
    </div>
    <div class="pane right">
      <div class="pane-header">
        <span>DECOY</span>
        <span id="badgeRight" class="mode-badge mode-decoy" style="display:none;">DECOY MODE</span>
      </div>
      <div class="pane-body" id="rightPane"><span style="color:var(--muted);">비정상 접근 버튼을 눌러주세요.</span></div>
    </div>
  </div>

  <!-- 로그 스트림 -->
  <div class="log-stream" id="logStream">
    <div class="log-info">// 접근 로그가 여기에 표시됩니다.</div>
  </div>
</div>

<script>
// ── 날짜 규칙 표시 ──
(function showRule(){
  const now  = new Date();
  const m    = now.getMonth() + 1;
  const d    = now.getDate();
  const digs = (String(m) + String(d)).split('').map(Number);
  const rot  = digs.reduce((a, b) => a + b, 0);
  document.getElementById('ruleText').innerHTML =
    `오늘 날짜: <span class="hl">${m}월 ${d}일</span>  |  ` +
    `자릿수 합산: <span class="hl">${digs.join(' + ')} = ${rot}</span>  |  ` +
    `회전 칸수: <span class="hl">${rot % 26}칸</span>  |  ` +
    `Seed 문서: <span class="hl">납기지연 메일 (v1)</span>`;
})();

// ── JSON → 하이라이팅 ──
function colorize(obj, isDecoy) {
  const json = JSON.stringify(obj, null, 2);
  return json
    .replace(/"([^"]+)":/g, `<span class="key">"$1":</span>`)
    .replace(/: "([^"]+)"/g, (_, v) =>
      `: <span class="${isDecoy ? 'val-decoy' : 'val-str'}">"${v}"</span>`)
    .replace(/: (-?[\d.]+)/g, `: <span class="val-num">$1</span>`);
}

function addLog(msg, type='info') {
  const el  = document.createElement('div');
  el.className = `log-${type}`;
  const ts  = new Date().toLocaleTimeString('ko-KR');
  el.textContent = `[${ts}] ${msg}`;
  const stream = document.getElementById('logStream');
  stream.appendChild(el);
  stream.scrollTop = stream.scrollHeight;
}

// ── 정상 접근 ──
async function fetchOriginal() {
  addLog('로그인 시도...', 'info');
  const lr = await fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({user_id: 'admin', password: 'admin1234'}),
  });
  if (!lr.ok) { addLog('로그인 실패', 'warn'); return; }
  const {token} = await lr.json();
  addLog('로그인 성공 — JWT 발급', 'ok');
  const dr = await fetch('/api/secure/model/latest', {
    headers: {'Authorization': `Bearer ${token}`},
  });
  const d = await dr.json();
  addLog(`/api/secure/model/latest → mode=${d.mode}`, 'ok');
  document.getElementById('leftPane').innerHTML = colorize(d.data ?? d, false);
  document.getElementById('badgeLeft').style.display = 'inline-block';
}

// ── 비정상 접근 ──
async function fetchDecoy() {
  addLog('토큰 없이 /api/secure/model/latest 직접 호출...', 'info');
  const r = await fetch('/api/secure/model/latest');
  const d = await r.json();
  addLog(`응답: mode=${d.mode}  seed_version=v${d.seed_version}  → DECOY 반환`, 'warn');

  document.getElementById('rightPane').innerHTML = colorize(d.data ?? d, true);
  document.getElementById('badgeRight').style.display = 'inline-block';
}

function resetAll() {
  document.getElementById('leftPane').innerHTML  = '<span style="color:var(--muted);">정상 접근 버튼을 눌러주세요.</span>';
  document.getElementById('rightPane').innerHTML = '<span style="color:var(--muted);">비정상 접근 버튼을 눌러주세요.</span>';
  document.getElementById('badgeLeft').style.display  = 'none';
  document.getElementById('badgeRight').style.display = 'none';
  document.getElementById('logStream').innerHTML = '<div class="log-info">// 접근 로그가 여기에 표시됩니다.</div>';
}
</script>
</body>
</html>
