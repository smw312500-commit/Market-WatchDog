<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ project_name }} - AI Risk Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .step-card { transition: all 0.5s ease; position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; pointer-events: none; transform: scale(0.95); z-index: 0; }
        .step-card.active { opacity: 1; pointer-events: auto; transform: scale(1); z-index: 10; }
        canvas { padding-bottom: 25px; }
    </style>
</head>
<body class="bg-[#0b0f1a] text-slate-200 p-8">
    <div class="max-w-[1400px] mx-auto">
        <header class="mb-12 border-b border-slate-800 pb-6 flex justify-between items-center">
            <h1 class="text-3xl font-black italic text-red-500 uppercase tracking-tighter cursor-pointer" onclick="location.href='/'">
                AI Market WatchDog
            </h1>

            <div class="flex items-center gap-6">
                <nav class="flex gap-6 mr-6 border-r border-slate-800 pr-6">
                    <a href="/" class="text-xs font-bold text-slate-400 hover:text-white transition-colors tracking-widest">홈(뉴스)</a>
                    <a href="#" class="text-xs font-bold text-slate-400 hover:text-white transition-colors tracking-widest">지표</a>
                </nav>
                <div class="flex gap-4">
                    <button class="text-xs font-bold text-slate-300 hover:text-white transition-colors">LOGIN</button>
                    <button class="text-xs font-bold bg-red-600 px-4 py-2 rounded-lg text-white hover:bg-red-500 transition-all shadow-lg shadow-red-600/20">
                        SIGN UP
                    </button>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            <div class="lg:col-span-2 relative">
                <div id="card-container" class="relative h-[580px]">
                    <div id="step-0" class="step-card active bg-[#161b22] p-8 rounded-3xl border border-slate-800 shadow-2xl">
                        <div class="text-xs font-bold text-blue-500 mb-4 uppercase tracking-widest">Step 01. Funding Entrance</div>
                        <h3 class="text-2xl font-bold mb-6 text-white">CP 발행 성공률 증감 (QoQ)</h3>
                        <div class="h-80"><canvas id="cpChart"></canvas></div>
                    </div>

                    <div id="step-1" class="step-card bg-[#161b22] p-8 rounded-3xl border border-slate-800 border-t-4 border-t-yellow-500 shadow-2xl">
                        <div class="text-xs font-bold text-yellow-500 mb-4 uppercase tracking-widest">Step 02. Market Bottleneck</div>
                        <h3 class="text-2xl font-bold mb-6 text-white">단기자금 발행 추이 (CP 3개월미만 & 단기사채)<span class="text-sm text-slate-400 ml-2">단위 : (조원)</span></h3>
                        <div class="h-80"><canvas id="stChart"></canvas></div>
                    </div>

                    <div id="step-2" class="step-card bg-[#161b22] p-8 rounded-3xl border border-slate-800 border-t-4 border-t-orange-600 shadow-2xl">
                        <div class="text-xs font-bold text-orange-600 mb-4 uppercase tracking-widest">Step 03. Risk Spillover</div>
                        <h3 class="text-2xl font-bold mb-6 text-white">비은행여신잔액<span class="text-sm text-slate-400 ml-2">단위 : (조원)</span></h3>
                        <div class="h-80"><canvas id="nonBankChart"></canvas></div>
                    </div>
                </div>

                <div class="flex gap-4 mt-8">
                    <button onclick="changeCard(-1)" class="bg-slate-800 p-4 rounded-xl flex-1 font-bold border border-slate-700 hover:bg-slate-700">← PREV</button>
                    <button onclick="changeCard(1)" class="bg-blue-600 p-4 rounded-xl flex-1 font-bold hover:bg-blue-500 text-white">NEXT →</button>
                </div>
            </div>

            <div class="bg-gradient-to-br from-red-900/40 to-slate-900 p-8 rounded-3xl border border-red-500/30 h-[670px] flex flex-col justify-between">
                <div class="text-center">
                    <div class="text-xs font-bold text-red-400 mb-4 uppercase tracking-widest">AI Diagnosis</div>
                    <div id="status-tag" class="text-6xl font-black mb-6 drop-shadow-2xl">---</div>
                    <div class="text-slate-400 font-bold">위험 확률: <span id="risk-prob" class="text-white text-xl">--%</span></div>
                </div>
                <div class="bg-black/40 p-6 rounded-2xl border border-white/5 italic text-blue-200 text-sm" id="explanation">분석 중...</div>
            </div>
        </div>
    </div>

    <script>
        let currentIdx = 0;
        function changeCard(dir) {
            const cards = document.querySelectorAll('.step-card');
            cards[currentIdx].classList.remove('active');
            currentIdx = (currentIdx + dir + cards.length) % cards.length;
            cards[currentIdx].classList.add('active');
        }

        async function init() {
            try {
                const res = await fetch('/api/analysis_summary');
                const data = await res.json();

                const opt = {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#fff', font: { weight: 'bold' } } },
                        y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } }
                    }
                };

                // 1번 차트
                new Chart(document.getElementById('cpChart'), {
                    type: 'bar',
                    data: { labels: data.labels, datasets: [{ data: data.cp_issuance, backgroundColor: '#3b82f6' }] },
                    options: opt
                });

                // 2번 차트 (선 2개)
                new Chart(document.getElementById('stChart'), {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [
                            { label: 'CP 3개월미만', data: data.maturity.cp_3m, borderColor: '#eab308', tension: 0.3 },
                            { label: '단기사채', data: data.maturity.st_bond, borderColor: '#34d399', tension: 0.3 }
                        ]
                    },
                    options: { ...opt, plugins: { legend: { display: true, labels: { color: '#fff' } } } }
                });

                // 3번 차트
                new Chart(document.getElementById('nonBankChart'), {
                    type: 'line',
                    data: { labels: data.labels, datasets: [{ data: data.non_bank_delta, borderColor: '#ea580c', fill: true }] },
                    options: opt
                });

                document.getElementById('status-tag').innerText = data.final_status.state;
                document.getElementById('risk-prob').innerText = (data.final_status.p_risk * 100).toFixed(1) + '%';
                document.getElementById('explanation').innerText = data.final_status.explanation;
            } catch (err) { console.error(err); }
        }
        window.onload = init;
    </script>
</body>
</html>
