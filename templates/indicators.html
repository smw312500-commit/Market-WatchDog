<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ project_name }} - 통합 지표 분석</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --border: #334155; }
        body { background: var(--bg); color: var(--text); font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: auto; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }

        /* 컨트롤 섹션 */
        .controls { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 300px; gap: 20px; }

        /* 지표 카테고리 스타일 */
        .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .category-box { background: #0f172a; border: 1px solid var(--border); padding: 15px; border-radius: 8px; }
        .category-title { color: var(--accent); font-weight: bold; margin-bottom: 10px; font-size: 0.95rem; border-left: 4px solid var(--accent); padding-left: 10px; }

        .indicator-list { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.85rem; }
        .indicator-item { display: flex; align-items: center; cursor: pointer; }
        .indicator-item input { margin-right: 8px; }

        /* 설정 필터 */
        .filter-group { display: flex; flex-direction: column; gap: 15px; }
        .filter-item label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        select, input[type="date"] { width: 100%; padding: 8px; border-radius: 4px; background: #0f172a; color: white; border: 1px solid var(--border); }

        .btn-update { width: 100%; padding: 15px; background: var(--accent); color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: auto; }
        .btn-update:hover { background: #7dd3fc; }

        /* 차트 영역 */
        .chart-box { background: var(--card); padding: 20px; border-radius: 12px; height: 650px; position: relative; }
        .loading { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🔍 Market WatchDog <small>Real-time Analysis</small></h1>
        <a href="/" style="color: var(--accent); text-decoration: none;">◀ Back to Main</a>
    </div>

    <div class="controls">
        <div class="category-grid">
            <div class="category-box">
                <div class="category-title">1. 시장 금리 (연%)</div>
                <div class="indicator-list">
                    <label class="indicator-item"><input type="checkbox" name="ids" value="cp_91d" checked> CP(91일)</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="MSB"> 통안증권(91일)</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="corp_bond_aa"> 회사채(AA-)</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="corp_bond_bbb"> 회사채(BBB-)</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="corp_bond_aa_private"> 회사채(민평)</label>
                </div>
            </div>
            <div class="category-box">
                <div class="category-title">2. 비은행 여신 (십억원)</div>
                <div class="indicator-list">
                    <label class="indicator-item"><input type="checkbox" name="ids" value="loan_savings_bank"> 저축은행 여신</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="loan_credit_coop"> 신협 여신</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="loan_mutual_credit"> 상호금융 여신</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="loan_community_credit"> 새마을금고 여신</label>
                </div>
            </div>
            <div class="category-box" style="grid-column: span 2;">
                <div class="category-title">3. 비은행 보고기관별 자산 (십억원)</div>
                <div class="indicator-list" style="grid-template-columns: repeat(4, 1fr);">
                    <label class="indicator-item"><input type="checkbox" name="ids" value="asset_savings_bank"> 저축은행</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="asset_merchant_bank"> 종금사</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="asset_community_credit"> 새마을금고</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="asset_credit_card"> 신용카드</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="asset_securities"> 증권사</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="asset_management"> 자산운용</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="asset_life_ins"> 생보사</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="asset_nonlife_ins"> 손보사</label>
                </div>
            </div>
            <div class="category-box" style="grid-column: span 2;">
                <div class="category-title">4. 금융자산부채 (CP/가계 - 십억원)</div>
                <div class="indicator-list" style="grid-template-columns: repeat(4, 1fr);">
                    <label class="indicator-item"><input type="checkbox" name="ids" value="cp_asset_finance"> 금융 CP자산</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="cp_debt_corp"> 기업 CP부채</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="household_asset"> 가계자산</label>
                    <label class="indicator-item"><input type="checkbox" name="ids" value="household_debt"> 가계부채</label>
                </div>
            </div>
        </div>

        <div class="filter-group">
            <div class="filter-item">
                <label>데이터 주기</label>
                <select id="freq">
                    <option value="Q">분기 (Q)</option>
                    <option value="M">월 (M)</option>
                    <option value="A">연 (A)</option>
                </select>
            </div>
            <div class="filter-item">
                <label>조회 범위</label>
                <input type="date" id="start_date" value="2010-01-01">
                <div style="text-align: center; margin: 5px 0;">~</div>
                <input type="date" id="end_date" value="2025-12-31">
            </div>
            <button class="btn-update" onclick="runAnalysis()">📊 분석 실행</button>
        </div>
    </div>

    <div class="chart-box">
        <div id="loadingText" class="loading">ECOS 서버에서 데이터를 가져오는 중...</div>
        <canvas id="mainChart"></canvas>
    </div>
</div>

<script>
    let chartInstance = null;

    async function runAnalysis() {
        const loading = document.getElementById('loadingText');
        const checked = document.querySelectorAll('input[name="ids"]:checked');
        const ids = Array.from(checked).map(cb => cb.value);
        const freq = document.getElementById('freq').value;
        const start = document.getElementById('start_date').value;
        const end = document.getElementById('end_date').value;

        if (ids.length === 0) return alert("분석할 지표를 최소 하나 골라줘 형!");

        loading.style.display = 'block';

        try {
            const promises = ids.map(id =>
                fetch(`/api/ecos_custom?id=${id}&freq=${freq}&start=${start}&end=${end}`).then(r => r.json())
            );
            const allData = await Promise.all(promises);

            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            // 모든 데이터의 날짜 통합 및 정렬
            const labels = [...new Set(allData.flatMap(dataset => dataset.map(d => d.TIME)))].sort();
            const colors = ['#38bdf8', '#fb7185', '#34d399', '#fbbf24', '#a78bfa', '#818cf8', '#f472b6', '#2dd4bf'];

            const datasets = allData.map((data, i) => {
                const labelName = Array.from(checked)[i].parentElement.innerText.trim();
                return {
                    label: labelName,
                    data: labels.map(l => {
                        const found = data.find(d => d.TIME === l);
                        return found ? found.DATA_VALUE : null;
                    }),
                    borderColor: colors[i % colors.length],
                    backgroundColor: colors[i % colors.length] + '11',
                    borderWidth: 2,
                    tension: 0.2,
                    pointRadius: 1
                };
            });

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                    },
                    plugins: {
                        legend: { labels: { color: '#f8fafc', font: { size: 12 } } }
                    }
                }
            });
        } catch (e) {
            alert("데이터 호출 실패! 서버 터미널이나 ECOS 키를 확인해봐.");
        } finally {
            loading.style.display = 'none';
        }
    }

    window.onload = runAnalysis;
</script>
</body>
</html>
