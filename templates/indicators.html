<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>{{ project_name }} - 지표 분석 센터</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --accent: #38bdf8; }
        body { background: var(--bg-color); color: var(--text-main); font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 15px; }

        .controls { background: var(--card-bg); padding: 25px; border-radius: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .control-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--accent); }

        select, input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; }

        .indicator-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; max-height: 150px; overflow-y: auto; }
        .indicator-item { display: flex; align-items: center; font-size: 0.9rem; }
        .indicator-item input { width: auto; margin-right: 10px; }

        .btn-update { grid-column: 1 / -1; padding: 15px; background: var(--accent); color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-update:hover { background: #7dd3fc; transform: translateY(-2px); }

        .chart-box { background: var(--card-bg); padding: 20px; border-radius: 12px; height: 600px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    </style>
</head>
<body>
    <div id="loading" class="loading-overlay"><span>데이터 분석 중...</span></div>

    <div class="container">
        <div class="header">
            <h1>🛡️ Market WatchDog <small>지표 분석 센터</small></h1>
            <a href="/" style="color: var(--accent); text-decoration: none;">홈으로</a>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>분석 지표 (복수 선택 가능)</label>
                <div class="indicator-list">
                    <div class="indicator-item"><input type="checkbox" name="ids" value="cp_asset_finance" checked> 금융법인 CP(자산)</div>
                    <div class="indicator-item"><input type="checkbox" name="ids" value="cp_debt_corp"> 비금융법인 CP(부채)</div>
                    <div class="indicator-item"><input type="checkbox" name="ids" value="cp_91d"> CP(91일) 금리</div>
                    <div class="indicator-item"><input type="checkbox" name="ids" value="loan_community_credit"> 새마을금고 여신</div>
                    <div class="indicator-item"><input type="checkbox" name="ids" value="asset_savings_bank"> 저축은행 자산</div>
                </div>
            </div>

            <div class="control-group">
                <label>데이터 주기</label>
                <select id="freq">
                    <option value="Q">분기별 (Q)</option>
                    <option value="M">월별 (M)</option>
                    <option value="A">연별 (A)</option>
                </select>
            </div>

            <div class="control-group">
                <label>조회 기간</label>
                <div style="display: flex; gap: 5px;">
                    <input type="date" id="start_date" value="2010-01-01">
                    <input type="date" id="end_date" value="2024-12-31">
                </div>
            </div>

            <button class="btn-update" onclick="updateAnalysis()">데이터 분석 및 시각화 실행</button>
        </div>

        <div class="chart-box">
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <script>
        let mainChart = null;

        async function updateAnalysis() {
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';

            const checkboxes = document.querySelectorAll('input[name="ids"]:checked');
            const ids = Array.from(checkboxes).map(cb => cb.value);
            const freq = document.getElementById('freq').value;
            const start = document.getElementById('start_date').value;
            const end = document.getElementById('end_date').value;

            if (ids.length === 0) {
                alert("최소 하나 이상의 지표를 선택해 형!");
                loading.style.display = 'none';
                return;
            }

            try {
                // 여러 지표 데이터를 병렬로 호출
                const fetchPromises = ids.map(id =>
                    fetch(`/api/ecos_custom?id=${id}&freq=${freq}&start=${start}&end=${end}`)
                    .then(r => r.json())
                );

                const results = await Promise.all(fetchPromises);

                const ctx = document.getElementById('mainChart').getContext('2d');
                if (mainChart) mainChart.destroy();

                // 모든 지표의 TIME을 합쳐서 X축 라벨 생성 (중복 제거)
                const allLabels = [...new Set(results.flatMap(r => r.map(d => d.TIME)))].sort();

                const colors = ['#38bdf8', '#fb7185', '#34d399', '#fbbf24', '#a78bfa'];

                const datasets = results.map((data, index) => {
                    const labelName = checkboxes[index].parentElement.innerText;
                    return {
                        label: labelName,
                        data: allLabels.map(label => {
                            const found = data.find(d => d.TIME === label);
                            return found ? found.DATA_VALUE : null;
                        }),
                        borderColor: colors[index % colors.length],
                        backgroundColor: colors[index % colors.length] + '22',
                        borderWidth: 2,
                        tension: 0.3,
                        pointRadius: 2
                    };
                });

                mainChart = new Chart(ctx, {
                    type: 'line',
                    data: { labels: allLabels, datasets: datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: {
                            legend: { position: 'top', labels: { color: '#f8fafc' } },
                            tooltip: { backgroundColor: '#1e293b', titleColor: '#38bdf8' }
                        },
                        scales: {
                            x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                            y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                        }
                    }
                });
            } catch (err) {
                console.error(err);
                alert("데이터 가져오다 사고 났어. 터미널 확인해봐.");
            } finally {
                loading.style.display = 'none';
            }
        }

        window.onload = updateAnalysis;
    </script>
</body>
</html>
