<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project_name }} - 통합 지표 분석</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 border-b border-slate-700 pb-4">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">
                🚀 Market WatchDog 분석 센터
            </h1>
            <p class="text-slate-400 mt-2">지표를 선택하고 복합 관계를 분석하세요.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-8">

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
                <h3 class="text-blue-400 font-bold mb-4 flex items-center">
                    <span class="mr-2">1️⃣</span> 통계 바구니 선택
                </h3>
                <div class="space-y-3" id="table-filter-group">
                    </div>
            </div>

            <div class="lg:col-span-2 bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl">
                <h3 class="text-cyan-400 font-bold mb-4 flex items-center">
                    <span class="mr-2">2️⃣</span> 세부 지표 담기 (중복 가능)
                </h3>
                <div id="item-checkbox-container" class="grid grid-cols-1 md:grid-cols-2 gap-2 h-40 overflow-y-auto pr-2 custom-scrollbar">
                    <p class="text-slate-500 italic text-sm">먼저 통계 바구니를 선택해 주세요.</p>
                </div>
            </div>

            <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl flex flex-col justify-between">
                <div>
                    <h3 class="text-emerald-400 font-bold mb-4">⚙️ 분석 옵션</h3>
                    <select id="freq-select" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm outline-none focus:border-blue-500">
                        <option value="Q">분기별 (Q)</option>
                        <option value="M">월별 (M)</option>
                        <option value="A">연별 (A)</option>
                    </select>
                </div>
                <button id="btn-draw" class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-95">
                    📈 분석 실행 (그래프 그리기)
                </button>
            </div>
        </div>

        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl relative">
            <div id="chart-loader" class="hidden absolute inset-0 bg-slate-800/80 flex items-center justify-center z-10 rounded-2xl">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500"></div>
            </div>
            <canvas id="mainChart"></canvas>
            <div id="empty-msg" class="py-40 text-center text-slate-500 italic">
                왼쪽 필터에서 지표를 선택하고 '분석 실행' 버튼을 눌러주세요.
            </div>
        </div>
    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>

    <script>
        let allIndicators = [];
        let myChart = null;

        // 1. 페이지 로드 시 지표 리스트 가져오기
        window.onload = async () => {
            const res = await fetch('/api/indicator_list');
            allIndicators = await res.json();

            // 그룹(Table) 목록 추출
            const groups = [...new Set(allIndicators.map(ind => ind.group))];
            const filter1Group = document.getElementById('table-filter-group');

            groups.forEach((group, idx) => {
                const id = `group-${idx}`;
                filter1Group.innerHTML += `
                    <label class="flex items-center space-x-3 cursor-pointer p-2 hover:bg-slate-700 rounded-lg transition">
                        <input type="radio" name="table-group" value="${group}" class="w-4 h-4 text-blue-500 bg-slate-900 border-slate-600 focus:ring-blue-600 focus:ring-2">
                        <span class="text-sm font-medium text-slate-300">${group}</span>
                    </label>
                `;
            });

            // 1번 필터 변경 이벤트
            document.getElementsByName('table-group').forEach(radio => {
                radio.onchange = (e) => updateItemCheckboxes(e.target.value);
            });
        };

        // 2. 2번 필터(체크박스) 업데이트
        function updateItemCheckboxes(selectedGroup) {
            const container = document.getElementById('item-checkbox-container');
            container.innerHTML = "";

            const filtered = allIndicators.filter(ind => ind.group === selectedGroup);
            filtered.forEach(ind => {
                container.innerHTML += `
                    <label class="flex items-center space-x-2 p-2 bg-slate-900 rounded-md border border-slate-700 hover:border-blue-500 cursor-pointer transition">
                        <input type="checkbox" value="${ind.id}" data-name="${ind.name}" class="ind-checkbox w-4 h-4 rounded text-cyan-600 bg-slate-800 border-slate-600">
                        <span class="text-xs text-slate-300 truncate">${ind.name}</span>
                    </label>
                `;
            });
        }

        // 3. 그래프 그리기 실행
        document.getElementById('btn-draw').onclick = async () => {
            const checkedBoxes = document.querySelectorAll('.ind-checkbox:checked');
            if (checkedBoxes.length === 0) return alert("분석할 지표를 최소 하나는 골라라!");

            document.getElementById('chart-loader').classList.remove('hidden');
            document.getElementById('empty-msg').classList.add('hidden');

            const selectedIds = Array.from(checkedBoxes).map(cb => cb.value);
            const freq = document.getElementById('freq-select').value;

            // 데이터 병렬 수집
            const dataPromises = selectedIds.map(id =>
                fetch(`/api/ecos_custom?id=${id}&freq=${freq}`).then(r => r.json())
            );

            const rawResults = await Promise.all(dataPromises);
            document.getElementById('chart-loader').classList.add('hidden');

            drawChart(rawResults);
        };

        function drawChart(results) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (myChart) myChart.destroy();

            // 모든 결과셋의 TIME(라벨) 합쳐서 정렬
            const allLabels = [...new Set(results.flatMap(r => r.data.map(d => d.TIME)))].sort();

            const datasets = results.map((res, idx) => {
                const color = getChartColor(idx);
                // 단위(unit_type)에 따라 좌축(money) / 우축(rate) 설정
                const yAxisID = res.unit_type === 'rate' ? 'y1' : 'y';

                // 데이터 매핑
                const dataMap = new Map(res.data.map(d => [d.TIME, d.DATA_VALUE]));
                const dataPoints = allLabels.map(label => dataMap.get(label) || null);

                return {
                    label: res.name,
                    data: dataPoints,
                    borderColor: color,
                    backgroundColor: color + '20',
                    yAxisID: yAxisID,
                    tension: 0.3,
                    borderWidth: 2,
                    pointRadius: 2
                };
            });

            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: allLabels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#94a3b8' } },
                        tooltip: { backgroundColor: '#1e293b' }
                    },
                    scales: {
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                        y: { // 좌측 축: 자금 규모 (조 단위 등)
                            title: { display: true, text: '금액 (조 원/십억 원)', color: '#94a3b8' },
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        },
                        y1: { // 우측 축: 금리 (%)
                            position: 'right',
                            title: { display: true, text: '금리 (%)', color: '#f472b6' },
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#f472b6' }
                        }
                    }
                }
            });
        }

        function getChartColor(idx) {
            const colors = ['#3b82f6', '#f472b6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
            return colors[idx % colors.length];
        }
    </script>
</body>
</html>
