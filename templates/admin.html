<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ project_name }} - 보안 관리자</title>
<style>
:root{--bg:#0f1117;--panel:#1a1d27;--border:#2d3148;--text:#e2e8f0;--muted:#64748b;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--mono:'Courier New',monospace;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;min-height:100vh;}
nav{background:#111;padding:14px 20px;display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--border);}
nav .logo{color:var(--green);font-weight:700;font-size:14px;font-family:var(--mono);}
nav a{color:#888;text-decoration:none;font-size:13px;}
nav a:hover{color:#fff;}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px;display:grid;gap:20px;}
.page-header{border-bottom:1px solid var(--border);padding-bottom:16px;}
.page-header h2{font-size:18px;color:#fff;font-family:var(--mono);}
.page-header p{color:var(--muted);font-size:11px;margin-top:4px;}

/* 로그인 오버레이 */
#loginOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:999;}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:32px;width:320px;}
.login-box h3{color:#fff;font-size:15px;margin-bottom:20px;font-family:var(--mono);}
.login-box input{width:100%;padding:8px 12px;background:#0f1117;border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:13px;margin-bottom:10px;}
.login-box button{width:100%;padding:9px;background:var(--green);border:none;border-radius:4px;color:#000;font-weight:700;font-size:13px;cursor:pointer;}
.err{color:var(--red);font-size:11px;margin-top:6px;}

/* 패널 */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:20px;}
.panel-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.stat{background:#0f1117;border:1px solid var(--border);border-radius:4px;padding:14px;text-align:center;}
.stat .num{font-size:28px;font-weight:700;font-family:var(--mono);}
.stat .lbl{font-size:10px;color:var(--muted);margin-top:2px;}
.green{color:var(--green);}
.red{color:var(--red);}
.amber{color:var(--amber);}

/* seed 섹션 */
.seed-info{background:#0f1117;border:1px solid var(--border);border-radius:4px;padding:14px;font-family:var(--mono);font-size:11px;line-height:1.7;color:#94a3b8;margin-bottom:14px;max-height:120px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;}
.seed-meta{display:flex;gap:16px;margin-bottom:14px;}
.seed-meta span{font-size:11px;color:var(--muted);}
.seed-meta b{color:var(--text);}
textarea{width:100%;height:100px;background:#0f1117;border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:11px;padding:10px;resize:vertical;margin-bottom:10px;}
.btn{padding:7px 16px;border-radius:4px;border:none;font-size:12px;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--green);color:#000;}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:4px 10px;font-size:11px;}

/* 히스토리 테이블 */
table{width:100%;border-collapse:collapse;font-size:11px;}
th{text-align:left;padding:6px 10px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600;}
td{padding:7px 10px;border-bottom:1px solid #1e2235;vertical-align:top;}
tr:last-child td{border-bottom:none;}
.badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-weight:600;}
.badge-ok{background:rgba(34,197,94,.15);color:var(--green);}
.badge-warn{background:rgba(239,68,68,.15);color:var(--red);}
.badge-info{background:rgba(59,130,246,.15);color:var(--blue);}
.mono{font-family:var(--mono);}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.file-card{background:#0f1117;border:1px solid var(--border);border-radius:4px;padding:12px;
           cursor:pointer;transition:border-color .15s;}
.file-card:hover{border-color:#64748b;}
.file-card.active{border-color:var(--green);}
.file-card .fname{font-family:var(--mono);font-size:11px;color:#7dd3fc;margin-bottom:6px;}
.file-card .fprev{font-size:10px;color:var(--muted);line-height:1.5;
                  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.file-card .fmark{font-size:10px;color:var(--green);font-weight:700;margin-top:6px;}
</style>
</head>
<body>


<nav>
  <span class="logo">&gt; MWD_SECURITY</span>
  <a href="/">홈</a>
  <a href="/analysis">시장감시</a>
  <a href="/demo">Decoy 데모</a>
  <a href="/admin" style="color:#fff;">관리자</a>
  <a href="/logout" style="margin-left:auto;color:#ef4444;">로그아웃</a>
</nav>

<div class="wrap">
  <div class="page-header">
    <h2>보안 관리 콘솔</h2>
    <p>Date-Based Dynamic Decoy Security Layer — Seed 관리 &amp; 접근 로그</p>
  </div>

  <!-- 통계 -->
  <div class="panel">
    <div class="panel-title">접근 통계</div>
    <div class="stat-row">
      <div class="stat"><div class="num green" id="statNormal">-</div><div class="lbl">정상 접근</div></div>
      <div class="stat"><div class="num red" id="statDecoy">-</div><div class="lbl">Decoy 반환</div></div>
      <div class="stat"><div class="num amber" id="statTotal">-</div><div class="lbl">전체 요청</div></div>
    </div>
  </div>

  <!-- mail_archive 파일 목록 -->
  <div class="panel">
    <div class="panel-title">Seed 문서 선택 — mail_archive/</div>
    <div class="file-grid" id="fileGrid">로딩 중...</div>
  </div>

  <!-- 현재 Seed -->
  <div class="panel">
    <div class="panel-title">현재 활성 Seed 문서</div>
    <div class="seed-meta">
      <span>버전: <b id="seedVer">-</b></span>
      <span>등록자: <b id="seedBy">-</b></span>
      <span>활성화: <b id="seedFrom">-</b></span>
    </div>
    <div class="seed-info" id="seedText">로딩 중...</div>
    <div class="panel-title" style="margin-top:16px;">새 Seed 등록</div>
    <textarea id="newSeed" placeholder="새 seed 문서 전문을 붙여넣으세요..."></textarea>
    <button class="btn btn-danger" onclick="registerSeed()">Seed 교체 (즉시 적용)</button>
  </div>

  <!-- Seed 이력 -->
  <div class="panel">
    <div class="panel-title">Seed 변경 이력</div>
    <table>
      <thead><tr><th>버전</th><th>등록자</th><th>활성화</th><th>비활성화</th><th>상태</th></tr></thead>
      <tbody id="seedHistory"></tbody>
    </table>
  </div>

  <!-- 접근 로그 -->
  <div class="panel">
    <div class="panel-title">최근 접근 로그</div>
    <table>
      <thead><tr><th>시각</th><th>경로</th><th>접근 유형</th><th>결과</th><th>Seed</th><th>IP</th></tr></thead>
      <tbody id="logTable"></tbody>
    </table>
  </div>
</div>

<script>
async function loadAll() {
  await Promise.all([loadStats(), loadSeed(), loadHistory(), loadLogs(), loadFiles()]);
}

async function loadFiles() {
  const r    = await fetch('/api/admin/mail-files', {credentials: 'same-origin'});
  const list = await r.json();
  document.getElementById('fileGrid').innerHTML = list.map(f => `
    <div class="file-card ${f.is_active ? 'active' : ''}" onclick="activateFile('${f.name}')">
      <div class="fname">${f.name}</div>
      <div class="fprev">${f.preview}</div>
      ${f.is_active ? '<div class="fmark">▶ 현재 SEED</div>' : ''}
    </div>`).join('');
}

async function activateFile(filename) {
  if (!confirm(`"${filename}" 을 새 Seed로 등록하시겠습니까?`)) return;
  const r = await fetch('/api/admin/mail-files/activate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin',
    body: JSON.stringify({filename}),
  });
  const d = await r.json();
  if (d.ok) {
    alert(`Seed v${d.seed_version} 활성화 완료 — ${d.filename}`);
    loadAll();
  } else {
    alert('오류: ' + (d.error ?? '알 수 없음'));
  }
}

async function loadStats() {
  const r = await fetch('/api/admin/access-logs/stats', {credentials: 'same-origin'});
  const d = await r.json();
  document.getElementById('statNormal').textContent = d.original_returned ?? 0;
  document.getElementById('statDecoy').textContent  = d.decoy_returned ?? 0;
  document.getElementById('statTotal').textContent  = d.total ?? 0;
}

async function loadSeed() {
  const r = await fetch('/api/admin/security-seed', {credentials: 'same-origin'});
  const d = await r.json();
  document.getElementById('seedVer').textContent  = `v${d.seed_version}`;
  document.getElementById('seedBy').textContent   = d.created_by;
  document.getElementById('seedFrom').textContent = d.active_from?.slice(0,16) ?? '-';
  document.getElementById('seedText').textContent = d.seed_phrase;
}

async function loadHistory() {
  const r    = await fetch('/api/admin/security-seed/history', {credentials: 'same-origin'});
  const list = await r.json();
  document.getElementById('seedHistory').innerHTML = list.map(s => `
    <tr>
      <td class="mono">v${s.seed_version}</td>
      <td>${s.created_by ?? '-'}</td>
      <td class="mono">${(s.active_from ?? '').slice(0,16)}</td>
      <td class="mono">${(s.active_to ?? '-').toString().slice(0,16)}</td>
      <td>${s.is_active ? '<span class="badge badge-ok">ACTIVE</span>' : '<span class="badge badge-warn">EXPIRED</span>'}</td>
    </tr>`).join('');
}

async function loadLogs() {
  const r    = await fetch('/api/admin/access-logs?limit=50', {credentials: 'same-origin'});
  const list = await r.json();
  const typeColor = {
    NORMAL_ACCESS:'badge-ok', UNAUTHORIZED:'badge-warn',
    KEY_MISSING:'badge-warn', TOKEN_EXPIRED:'badge-warn', DECOY_RETURNED:'badge-warn',
  };
  const resultColor = {
    ORIGINAL_RETURNED:'badge-ok', DECOY_RETURNED:'badge-warn', BLOCKED:'badge-warn',
  };
  document.getElementById('logTable').innerHTML = list.map(l => `
    <tr>
      <td class="mono">${(l.created_at ?? '').slice(0,16)}</td>
      <td class="mono">${l.request_path ?? '-'}</td>
      <td><span class="badge ${typeColor[l.access_type] ?? 'badge-info'}">${l.access_type}</span></td>
      <td><span class="badge ${resultColor[l.result_type] ?? 'badge-info'}">${l.result_type}</span></td>
      <td class="mono">${l.seed_version != null ? `v${l.seed_version}` : '-'}</td>
      <td class="mono">${l.ip_address ?? '-'}</td>
    </tr>`).join('');
}

async function registerSeed() {
  const text = document.getElementById('newSeed').value.trim();
  if (!text) { alert('seed 문서를 입력하세요.'); return; }
  if (!confirm('Seed를 교체하면 즉시 적용됩니다. 계속하시겠습니까?')) return;
  const r = await fetch('/api/admin/security-seed', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin',
    body: JSON.stringify({seed_phrase: text, created_by: 'admin'}),
  });
  const d = await r.json();
  if (d.ok) {
    alert(`Seed v${d.seed_version} 활성화 완료`);
    document.getElementById('newSeed').value = '';
    loadAll();
  } else {
    alert('오류: ' + (d.error ?? '알 수 없음'));
  }
}

loadAll();
</script>
</body>
</html>
